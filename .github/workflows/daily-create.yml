name: Daily Creative Project
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Project
        id: gen
        run: python generator.py

      - name: Move to projects dir
        run: |
          mkdir -p projects
          PROJECT_NAME="${{ steps.gen.outputs.name }}"
          PROJECT_DIR="${{ steps.gen.outputs.dir }}"
          if [ -d "$PROJECT_DIR" ]; then
            rm -rf "projects/$PROJECT_NAME"
            cp -r "$PROJECT_DIR" "projects/$PROJECT_NAME"
          fi

      - name: Update index
        run: python update_index.py

      - name: Commit and Push
        run: |
          git config user.name "solcat1007-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "feat: add ${{ steps.gen.outputs.name }} - ${{ steps.gen.outputs.desc }}" || echo "Nothing to commit"
          git push
